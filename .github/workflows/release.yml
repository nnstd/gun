name: release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gun

jobs:
  docker:
    strategy:
      matrix:
        variant: [default, baseline]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=v(.*),group=1,suffix=${{ matrix.variant == 'baseline' && '-baseline' || '' }}
            type=raw,value=latest${{ matrix.variant == 'baseline' && '-baseline' || '' }},enable=${{ startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: BASELINE=${{ matrix.variant == 'baseline' && '1' || '0' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    strategy:
      matrix:
        variant: [default, baseline]
        target:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          GOFLAGS: ${{ matrix.variant == 'baseline' && '-tags=baseline' || '' }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          suffix=""
          [ "${{ matrix.variant }}" = "baseline" ] && suffix="-baseline"
          bin="gun-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}${suffix}${ext}"
          go build -ldflags "-X main.gunModuleRoot=/opt/gun" -o "$bin" .
          echo "artifact=$bin" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: ${{ env.artifact }}

  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
