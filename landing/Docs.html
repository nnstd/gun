<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gun — Docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Space Grotesk', sans-serif;
  background: #08080f; color: #e8e8f4; min-height: 100vh; line-height: 1.55;
}
body::before {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    radial-gradient(ellipse 60% 40% at 80% -10%, rgba(66,68,147,0.45) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 0% 20%, rgba(66,68,147,0.25) 0%, transparent 55%);
}
body::after {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.45;
  background-image:
    linear-gradient(rgba(66,68,147,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(66,68,147,0.05) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse 80% 70% at 50% 30%, #000 0%, transparent 75%);
}
#root { position: relative; z-index: 1; }
::selection { background: #424493; color: #fff; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(66,68,147,0.35); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(66,68,147,0.6); }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
@keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const C = {
  bg: '#08080f', panel: '#10101e', panelHi: '#16162a',
  border: 'rgba(66,68,147,0.25)', borderHi: 'rgba(66,68,147,0.55)',
  text: '#e8e8f4', muted: '#8888aa', dim: '#5c5cb8', faint: '#44445a',
  primary: '#424493', primaryHi: '#6666cc',
  green: '#4eca8a', amber: '#f5c542', cyan: '#4dd0e8', pink: '#f472b6',
};

// ── Mascot mark (matches landing) ─────────────────────────────────────
const MascotMark = ({ size = 28 }) => (
  <svg width={size} height={size} viewBox="0 0 200 200" fill="none" style={{ flexShrink:0, filter:'drop-shadow(0 0 8px rgba(66,68,147,0.6))' }}>
    <defs>
      <radialGradient id={`mm-${size}`} cx="40%" cy="35%" r="65%"><stop offset="0%" stopColor="#6666d4"/><stop offset="100%" stopColor="#2a2a72"/></radialGradient>
    </defs>
    <ellipse cx="82" cy="54" rx="18" ry="22" fill="#3535a0"/>
    <ellipse cx="118" cy="54" rx="18" ry="22" fill="#3535a0"/>
    <circle cx="100" cy="96" r="80" fill={`url(#mm-${size})`}/>
    <circle cx="78" cy="92" r="18" fill="white"/>
    <circle cx="122" cy="92" r="18" fill="white"/>
    <circle cx="80" cy="94" r="11" fill="#0f0f2e"/>
    <circle cx="124" cy="94" r="11" fill="#0f0f2e"/>
    <circle cx="85" cy="88" r="4.5" fill="white"/>
    <circle cx="129" cy="88" r="4.5" fill="white"/>
    <path d="M82 120 Q100 136 118 120" stroke="#0f0f2e" strokeWidth="6" fill="none" strokeLinecap="round"/>
  </svg>
);

// ── Nav (matches landing) ─────────────────────────────────────────────
const Nav = ({ crumb }) => (
  <nav style={{
    display:'grid', gridTemplateColumns:'auto 1fr auto', alignItems:'center', gap:32,
    padding:'18px 48px', borderBottom:`1px solid ${C.border}`,
    backdropFilter:'blur(14px)', background:'rgba(8,8,15,0.78)',
    position:'sticky', top:0, zIndex:100
  }}>
    <div style={{ display:'flex', alignItems:'center', gap:16 }}>
      <a href="Gun Landing Page.html" style={{ display:'flex', alignItems:'center', gap:10, textDecoration:'none' }}>
        <MascotMark size={32}/>
        <span style={{ fontFamily:"'Syne',sans-serif", fontSize:24, fontWeight:800, letterSpacing:-0.5, color:C.text }}>gun</span>
      </a>
      <span style={{ color:'rgba(255,255,255,0.12)', fontSize:18 }}>/</span>
      <span style={{ fontSize:14, color:C.muted, fontFamily:"'JetBrains Mono',monospace", letterSpacing:'0.04em' }}>{crumb}</span>
    </div>
    <ul style={{ display:'flex', gap:28, listStyle:'none', justifyContent:'center' }}>
      {[['Docs','Docs.html',true],['Playground','Gun Landing Page.html#playground',false],['Benchmarks','Gun Landing Page.html#benchmarks',false],['Examples','Gun Landing Page.html#examples',false],['Blog','Blog.html',false]].map(([n,h,active]) => (
        <li key={n}><a href={h} style={{ color: active ? C.text : C.muted, textDecoration:'none', fontSize:14, fontWeight:500 }}
          onMouseEnter={e=>e.target.style.color=C.text} onMouseLeave={e=>e.target.style.color = active ? C.text : C.muted}
        >{n}</a></li>
      ))}
    </ul>
    <div style={{ display:'flex', gap:12, alignItems:'center' }}>
      <a href="#" style={{ color:C.muted, fontSize:13, textDecoration:'none', display:'flex', alignItems:'center', gap:6 }}
        onMouseEnter={e=>e.currentTarget.style.color=C.text} onMouseLeave={e=>e.currentTarget.style.color=C.muted}>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2 .37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        14.2k
      </a>
      <a href="Gun Landing Page.html" style={{ background:C.primary, color:'white', padding:'9px 18px', borderRadius:8, fontSize:13, fontWeight:600, textDecoration:'none', boxShadow:`0 0 18px ${C.primary}55` }}
        onMouseEnter={e=>{e.currentTarget.style.background=C.primaryHi}}
        onMouseLeave={e=>{e.currentTarget.style.background=C.primary}}>
        Install →
      </a>
    </div>
  </nav>
);

// ── Footer (matches landing) ──────────────────────────────────────────
const Footer = () => (
  <footer style={{ borderTop:`1px solid ${C.border}`, padding:'48px 48px 32px', maxWidth:1480, margin:'0 auto' }}>
    <div style={{ display:'grid', gridTemplateColumns:'1.4fr 1fr 1fr 1fr', gap:48, paddingBottom:36, borderBottom:`1px solid ${C.border}` }}>
      <div>
        <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14 }}>
          <MascotMark size={28}/>
          <span style={{ fontFamily:"'Syne',sans-serif", fontSize:22, fontWeight:800, color:C.text, letterSpacing:-0.5 }}>gun</span>
        </div>
        <p style={{ fontSize:13, color:C.muted, lineHeight:1.6, maxWidth:300 }}>
          A JavaScript-to-Go compiler with a runtime that gets out of your way.
        </p>
      </div>
      {[
        ['Product', ['Docs','Playground','Benchmarks','Changelog','Roadmap']],
        ['Resources', ['Examples','Migration guide','Source maps','API reference']],
        ['Community', ['GitHub','Discord','Twitter','Bluesky','npm']],
      ].map(([h, links]) => (
        <div key={h}>
          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, fontWeight:700, letterSpacing:'0.16em', textTransform:'uppercase', color:C.dim, marginBottom:14 }}>{h}</div>
          <ul style={{ listStyle:'none', display:'flex', flexDirection:'column', gap:8 }}>
            {links.map(l => (
              <li key={l}><a href={l==='Docs'?'Docs.html':'#'} style={{ fontSize:13, color:C.muted, textDecoration:'none' }}
                onMouseEnter={e=>e.target.style.color=C.text} onMouseLeave={e=>e.target.style.color=C.muted}>{l}</a></li>
            ))}
          </ul>
        </div>
      ))}
    </div>
    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', paddingTop:24, fontSize:12, color:C.faint, fontFamily:"'JetBrains Mono',monospace" }}>
      <div>MIT · © 2026 the gun project</div>
      <div style={{ display:'flex', gap:24 }}>
        <span><span style={{ color:C.green }}>●</span> all systems normal</span>
        <span>v1.0.2 · go1.22+</span>
      </div>
    </div>
  </footer>
);

// ── Doc atoms ─────────────────────────────────────────────────────────
const H1 = ({c}) => <h1 style={{ fontFamily:"'Syne',sans-serif", fontSize:'clamp(36px,4vw,52px)', fontWeight:800, letterSpacing:-1.5, marginBottom:18, color:C.text, lineHeight:1.05 }}>{c}</h1>;
const H2 = ({c, id}) => <h2 id={id} style={{ fontFamily:"'Syne',sans-serif", fontSize:24, fontWeight:800, letterSpacing:-0.6, margin:'56px 0 14px', color:C.text, paddingTop:36, borderTop:`1px solid ${C.border}` }}>{c}</h2>;
const H3 = ({c}) => <h3 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:16, fontWeight:700, letterSpacing:-0.2, margin:'28px 0 8px', color:C.text }}>{c}</h3>;
const P  = ({c, children}) => <p style={{ fontSize:15.5, color:'#b0b0c8', lineHeight:1.75, marginBottom:14 }}>{c || children}</p>;
const Lead = ({c}) => <p style={{ fontSize:18, color:C.muted, lineHeight:1.65, marginBottom:32, maxWidth:700 }}>{c}</p>;
const IC = ({c}) => <code style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:12.5, background:'rgba(66,68,147,0.15)', border:`1px solid ${C.border}`, padding:'1.5px 7px', borderRadius:5, color:'#a0a0ff' }}>{c}</code>;

const langStyle = (lang) => ({
  bash: { bg:'rgba(78,202,138,0.1)', co:C.green, bd:'rgba(78,202,138,0.3)', label:'Shell' },
  js:   { bg:'rgba(245,197,66,0.12)', co:C.amber, bd:'rgba(245,197,66,0.3)', label:'JavaScript' },
  ts:   { bg:'rgba(77,208,232,0.1)', co:C.cyan, bd:'rgba(77,208,232,0.3)', label:'TypeScript' },
  go:   { bg:'rgba(77,208,232,0.08)', co:'#4dd0e8', bd:'rgba(77,208,232,0.25)', label:'Go' },
}[lang] || { bg:'rgba(66,68,147,0.1)', co:C.dim, bd:C.border, label:lang });

const CB = ({ lang='go', file, code }) => {
  const [copied, setCopied] = useState(false);
  const s = langStyle(lang);
  const onCopy = () => {
    try { navigator.clipboard.writeText(code); } catch(e) {}
    setCopied(true); setTimeout(()=>setCopied(false), 1400);
  };
  return (
    <div style={{ background:'#0a0a14', border:`1px solid ${C.border}`, borderRadius:12, overflow:'hidden', margin:'20px 0', boxShadow:'0 8px 28px rgba(0,0,0,0.35)' }}>
      <div style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 16px', borderBottom:`1px solid ${C.border}`, background:'rgba(66,68,147,0.05)' }}>
        <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, fontWeight:700, padding:'2.5px 8px', borderRadius:4, background:s.bg, color:s.co, border:`1px solid ${s.bd}`, letterSpacing:'0.06em' }}>{s.label}</span>
        {file && <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11.5, color:C.faint }}>{file}</span>}
        <button onClick={onCopy} style={{ marginLeft:'auto', background: copied ? 'rgba(78,202,138,0.15)' : 'transparent', border:`1px solid ${copied ? 'rgba(78,202,138,0.5)' : C.border}`, color: copied ? C.green : C.muted, padding:'3px 9px', borderRadius:5, cursor:'pointer', fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, fontWeight:700, letterSpacing:'0.1em', textTransform:'uppercase' }}>{copied ? '✓' : 'COPY'}</button>
      </div>
      <pre style={{ padding:'18px 20px', fontFamily:"'JetBrains Mono',monospace", fontSize:13, lineHeight:1.8, color:'#d8d8e8', overflowX:'auto', whiteSpace:'pre' }}>{code}</pre>
    </div>
  );
};

const Note = ({ type='info', children }) => {
  const m = {
    info: { bg:'rgba(66,68,147,0.08)', bd:'rgba(66,68,147,0.4)', co:'#a0a0ff', ic:'i' },
    tip:  { bg:'rgba(78,202,138,0.06)', bd:'rgba(78,202,138,0.32)', co:C.green, ic:'★' },
    warn: { bg:'rgba(245,197,66,0.06)', bd:'rgba(245,197,66,0.32)', co:C.amber, ic:'!' },
  }[type];
  return (
    <div style={{ background:m.bg, border:`1px solid ${m.bd}`, borderRadius:10, padding:'14px 18px 14px 16px', margin:'22px 0', display:'flex', gap:14, alignItems:'flex-start' }}>
      <span style={{
        flexShrink:0, width:22, height:22, borderRadius:'50%',
        background:m.bg, border:`1px solid ${m.bd}`, color:m.co,
        display:'flex', alignItems:'center', justifyContent:'center',
        fontFamily:"'JetBrains Mono',monospace", fontSize:11, fontWeight:800
      }}>{m.ic}</span>
      <div style={{ fontSize:14, color:'#c0c0e0', lineHeight:1.65 }}>{children}</div>
    </div>
  );
};

// ── Sidebar ───────────────────────────────────────────────────────────
const sidebar = [
  { label: 'Getting Started', icon:'01', items: ['Introduction','Installation','Quick Start'] },
  { label: 'Core Concepts',   icon:'02', items: ['How It Works','JSValue Runtime','Event Loop'] },
  { label: 'Language',        icon:'03', items: ['Variables','Functions','Classes','Async / Await','Modules'] },
  { label: 'APIs',            icon:'04', items: ['Node.js Compat','Bun Compat','npm Dependencies'] },
  { label: 'Configuration',   icon:'05', items: ['gun.config.js','CLI Reference','Source Maps'] },
  { label: 'Advanced',        icon:'06', items: ['Incremental Builds','CI Integration','Debugging'] },
];
const allPages = sidebar.flatMap(g => g.items);

// ── Pages ─────────────────────────────────────────────────────────────
const pages = {
  'Introduction': () => <>
    <div style={{ display:'inline-flex', alignItems:'center', gap:8, fontFamily:"'JetBrains Mono',monospace", fontSize:10.5, fontWeight:700, letterSpacing:'0.14em', color:C.dim, padding:'5px 11px', borderRadius:100, background:'rgba(66,68,147,0.08)', border:`1px solid ${C.border}`, marginBottom:18 }}>
      <span style={{ background:C.primary, color:'#fff', padding:'1.5px 7px', borderRadius:100, fontSize:9.5 }}>v1.0.2</span>
      LATEST · APRIL 2026
    </div>
    <H1 c="Introduction"/>
    <Lead c="Gun is a JavaScript-to-Go transpiler. It converts your JS/TS source — and its npm dependencies — into valid, compilable Go code that runs natively on Go's runtime, with no interpreter overhead and no Node.js on the server."/>
    <P c="Unlike source-to-source translators that try to produce idiomatic Go, Gun preserves JavaScript semantics through a lightweight runtime called jsvalue. Dynamic typing, prototype chains, the event loop, and all JS built-ins behave exactly as they do in Node.js or Bun."/>
    <Note type="tip">Gun is not trying to turn your JS into hand-written Go. It's trying to make your JS <em>run as Go</em> — fast, compiled, and dependency-free in production.</Note>

    <H2 c="Why Gun?"/>
    <P c="JavaScript is fast to write. Go is fast to run. Gun gives you both — write in JS, ship a Go binary. No rewrite required."/>
    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, margin:'24px 0' }}>
      {[
        ['10× faster runtime','Go compiled runtime vs Node.js V8.','#4eca8a'],
        ['Zero runtime deps','No Node.js or Bun needed on servers.','#4dd0e8'],
        ['Node + Bun APIs','Full compatibility with common built-ins.','#a0a0ff'],
        ['npm deps included','Your dependencies are transpiled too.','#f5c542'],
      ].map(([t,d,co])=>(
        <div key={t} style={{ background:'rgba(66,68,147,0.06)', border:`1px solid ${C.border}`, borderRadius:10, padding:'18px 20px' }}>
          <div style={{ width:8, height:8, background:co, borderRadius:'50%', boxShadow:`0 0 10px ${co}80`, marginBottom:10 }}/>
          <div style={{ fontSize:14, fontWeight:700, color:C.text, marginBottom:5 }}>{t}</div>
          <div style={{ fontSize:13, color:C.muted, lineHeight:1.55 }}>{d}</div>
        </div>
      ))}
    </div>

    <H2 c="When not to use Gun"/>
    <P c="Gun is built for server-side JS that wants to ship as a static Go binary. It's not the right tool for: front-end bundles (use esbuild), code that depends on V8-specific behavior (e.g. eval at runtime), or projects that need a JIT for hot-path optimization."/>
  </>,

  'Installation': () => <>
    <H1 c="Installation"/>
    <Lead c="Gun ships as an npm package. You need a Node.js 18+ or Bun 1.x environment for the CLI, and Go 1.21+ to compile the output."/>

    <H2 c="Prerequisites"/>
    <CB lang="bash" code={`node --version    # → v20.x or higher
go version        # → 1.21+`}/>

    <H2 c="Install the CLI"/>
    <P c="Pick your package manager — they all work. The CLI has no native binaries; it's pure JS."/>
    <CB lang="bash" code={`# npm
npm i -g gun-transpiler

# bun
bun add -g gun-transpiler

# yarn / pnpm
yarn global add gun-transpiler
pnpm add -g gun-transpiler`}/>

    <H2 c="Verify"/>
    <CB lang="bash" code={`gun --version
# → gun v1.0.2 (go1.22)`}/>
    <Note>Gun also works as a local dev dependency. Run via <IC c="npx gun"/> or wire it into your <IC c="package.json"/> scripts — useful for monorepos.</Note>

    <H2 c="Go runtime module"/>
    <P c="The transpiled output imports Gun's Go runtime. Add it to your Go module once:"/>
    <CB lang="bash" code={`go get github.com/nnstd/gun/runtime@latest`}/>
    <P c="Gun pins a runtime version to each CLI release. Mismatched versions are rejected at compile time with a clear error."/>
  </>,

  'Quick Start': () => <>
    <H1 c="Quick Start"/>
    <Lead c="Transpile your first file in under 60 seconds. We'll build a working HTTP server end-to-end."/>

    <H2 c="1 · Write some JavaScript"/>
    <CB lang="js" file="server.js" code={`import { createServer } from 'http'

const port = 8080

createServer((req, res) => {
  res.writeHead(200, { 'Content-Type': 'application/json' })
  res.end(JSON.stringify({ message: 'Hello from Go!' }))
}).listen(port)

console.log(\`Listening on :\${port}\`)`}/>

    <H2 c="2 · Transpile"/>
    <CB lang="bash" code={`gun transpile server.js -o server.go`}/>

    <H2 c="3 · Run it"/>
    <CB lang="bash" code={`go run server.go
# → Listening on :8080`}/>
    <Note type="tip">Use <IC c="gun watch"/> during development to auto-transpile on every save. With Tree-sitter incremental parsing, rebuilds typically land under <IC c="20ms"/>.</Note>

    <H2 c="4 · Build a binary"/>
    <CB lang="bash" code={`go build -o server ./...
./server`}/>
    <P c="That's it — you're running JavaScript logic inside a native Go binary. No Node.js required on the server, no Docker layers for your runtime, just a single static executable."/>

    <H2 c="What's next"/>
    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginTop:14 }}>
      {[
        ['How It Works','Walk through Gun\'s 4-stage pipeline.'],
        ['JSValue Runtime','Learn how JS semantics map to Go.'],
        ['gun.config.js','Configure the transpiler for real apps.'],
        ['CLI Reference','Every flag, every command.'],
      ].map(([t,d])=>(
        <div key={t} style={{ background:'rgba(66,68,147,0.05)', border:`1px solid ${C.border}`, borderRadius:10, padding:'14px 18px' }}>
          <div style={{ fontSize:14, fontWeight:700, color:C.text, marginBottom:4 }}>{t}</div>
          <div style={{ fontSize:13, color:C.muted }}>{d}</div>
        </div>
      ))}
    </div>
  </>,

  'How It Works': () => <>
    <H1 c="How It Works"/>
    <Lead c="Gun's transpilation pipeline has four stages. Each is independent, observable, and incrementally re-runnable."/>
    {[
      ['01','Parse','Gun walks your JS/TS source using Tree-sitter — a fast, incremental parser. It builds a concrete syntax tree for every file in your project, including npm dependencies under node_modules.','#a0a0ff'],
      ['02','Analyze','A type-flow pass resolves variable scopes, infers types from usage patterns, and maps JS constructs to their Go equivalents. This is also where dead code elimination and module deduplication happen.','#4dd0e8'],
      ['03','Emit','The Go emitter outputs valid Go code. All values flow through the JSValue runtime to preserve JS semantics — dynamic property access, prototype chains, hoisting, all of it.','#4eca8a'],
      ['04','Link','Import paths are rewritten to Go module paths, go.mod is updated, and the output is formatted with gofmt. The result compiles with a stock Go toolchain.','#f5c542'],
    ].map(([n,t,d,co])=>(
      <div key={n} style={{ display:'flex', gap:20, margin:'22px 0', alignItems:'flex-start' }}>
        <div style={{ width:48, height:48, background:'rgba(66,68,147,0.1)', border:`1px solid ${C.border}`, borderRadius:10, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:"'JetBrains Mono',monospace", fontSize:13, fontWeight:800, color:co, flexShrink:0, boxShadow:`inset 0 0 0 1px ${co}30` }}>{n}</div>
        <div style={{ flex:1 }}>
          <div style={{ fontWeight:700, fontSize:15, color:C.text, marginBottom:6 }}>{t}</div>
          <div style={{ fontSize:14.5, color:C.muted, lineHeight:1.7 }}>{d}</div>
        </div>
      </div>
    ))}
    <Note type="tip">All four stages are individually inspectable. Run <IC c="gun debug --stage=parse"/> on any file to dump the intermediate output — handy when you're filing a bug or curious about a transformation.</Note>
  </>,

  'JSValue Runtime': () => <>
    <H1 c="JSValue Runtime"/>
    <Lead c="Every value in transpiled code is a *jsvalue.JSValue. This single type wraps any JavaScript value and provides JS-compatible operations inside Go."/>

    <H2 c="Constructors"/>
    <CB lang="go" code={`jsvalue.NewNumber(float64(42))
jsvalue.NewString("hello")
jsvalue.NewBool(true)
jsvalue.NewNull()
jsvalue.NewUndefined()
jsvalue.NewFunction(myFunc)
jsvalue.ObjectFrom(map[string]any{
    "name": jsvalue.NewString("gun"),
})`}/>

    <H2 c="Property access"/>
    <P c="Dynamic property access mirrors JavaScript's prototype lookup semantics. You don't call these directly — Gun emits them automatically."/>
    <CB lang="go" code={`obj.Get("key")             // obj.key
obj.Set("key", val)        // obj.key = val
obj.MethodCall("fn", arg)  // obj.fn(arg)
fn.Call(arg1, arg2)        // fn(arg1, arg2)`}/>

    <H2 c="Type coercion"/>
    <P c="JS's loose equality and implicit coercion are all handled by the runtime."/>
    <CB lang="go" code={`a.LooseEquals(b)   // ==
a.StrictEquals(b)  // ===
a.ToNumber()       // Number(a)
a.ToString()       // String(a)
a.Truthy()         // !!a`}/>
    <Note>The JSValue runtime lives in <IC c="github.com/nnstd/gun/runtime/builtin"/>. You don't import it in your Go code by hand — Gun does that during the link stage.</Note>
  </>,

  'Event Loop': () => <>
    <H1 c="Event Loop"/>
    <Lead c="Gun ships a built-in event loop runtime that mirrors Node.js / Bun semantics. async / await, Promises, timers, and I/O callbacks all go through it."/>

    <H2 c="The shape of main()"/>
    <CB lang="go" code={`package main

import (
    "github.com/nnstd/gun/runtime/error"
    "github.com/nnstd/gun/runtime/eventloop"
)

func main() {
    defer error.RecoverMain()

    // ... transpiled body of your JS module ...

    eventloop.Default.Run()
}`}/>
    <Note><IC c="eventloop.Default.Run()"/> is always the last call in <IC c="main()"/>. It blocks until the queue is empty — same behavior as Node's libuv loop.</Note>

    <H2 c="Tasks &amp; microtasks"/>
    <P c="Gun preserves the JS distinction between tasks (timers, I/O) and microtasks (Promise continuations). Microtasks drain between every macro-task — exactly like in V8."/>
    <CB lang="js" code={`Promise.resolve().then(() => console.log('micro'))
setTimeout(() => console.log('macro'), 0)
console.log('sync')

// → sync, micro, macro`}/>
  </>,

  'Variables': () => <>
    <H1 c="Variables"/>
    <Lead c="let, const and var all transpile to JSValue bindings. Block scoping, hoisting, and the temporal dead zone are preserved."/>
    <CB lang="js" code={`let count = 0
const name = 'gun'
var legacy = true`}/>
    <CB lang="go" code={`var count = jsvalue.NewNumber(0)
var name = jsvalue.NewString("gun")
var legacy = jsvalue.NewBool(true)`}/>
  </>,

  'Functions': () => <>
    <H1 c="Functions"/>
    <Lead c="Function declarations, expressions, arrows and methods all map to *jsvalue.JSValue function bindings."/>
    <CB lang="js" code={`function add(a, b) { return a + b }
const square = x => x * x
const obj = { greet() { return 'hi' } }`}/>
    <P c="Closures capture their lexical scope. Hoisting works as expected — you can call a function declaration before it's textually defined."/>
  </>,

  'Classes': () => <>
    <H1 c="Classes"/>
    <Lead c="ES classes transpile to constructor functions plus a prototype chain. Inheritance, super calls, and getters/setters all work."/>
    <CB lang="js" code={`class Animal {
  constructor(name) { this.name = name }
  speak() { return \`\${this.name} makes a sound\` }
}

class Dog extends Animal {
  speak() { return \`\${this.name} barks\` }
}`}/>
  </>,

  'Async / Await': () => <>
    <H1 c="Async / Await"/>
    <Lead c="async functions return Promises. await suspends execution and resumes when the Promise settles, integrated with the event loop."/>
    <CB lang="js" code={`async function fetchUser(id) {
  const res = await fetch(\`/api/users/\${id}\`)
  return res.json()
}`}/>
  </>,

  'Modules': () => <>
    <H1 c="Modules"/>
    <Lead c="Both ESM and CommonJS are supported. import / export and require / module.exports map cleanly to Go imports."/>
    <CB lang="js" code={`// ESM
import { readFile } from 'fs/promises'
export const VERSION = '1.0.0'

// CJS
const fs = require('fs')
module.exports = { VERSION: '1.0.0' }`}/>
  </>,

  'Node.js Compat': () => <>
    <H1 c="Node.js Compat"/>
    <Lead c="Common built-ins are implemented natively in Go. The list is growing — open an issue if you hit a gap."/>
    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginTop:8 }}>
      {[
        ['http / https','createServer, request, fetch'],
        ['fs','readFile, writeFile, stat, watch'],
        ['path','join, resolve, dirname, basename'],
        ['console','log, error, warn, table, time'],
        ['process','env, argv, exit, cwd, hrtime'],
        ['timers','setTimeout, setInterval, clearTimeout'],
        ['events','EventEmitter'],
        ['stream','Readable, Writable, Transform, pipe'],
        ['crypto','randomBytes, createHash, subtle'],
        ['url','URL, URLSearchParams'],
      ].map(([m,a])=>(
        <div key={m} style={{ background:'rgba(66,68,147,0.05)', border:`1px solid ${C.border}`, borderRadius:10, padding:'14px 16px' }}>
          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:13, color:C.cyan, marginBottom:4, fontWeight:700 }}>{m}</div>
          <div style={{ fontSize:12.5, color:C.muted }}>{a}</div>
        </div>
      ))}
    </div>
  </>,

  'Bun Compat': () => <>
    <H1 c="Bun Compat"/>
    <Lead c="Bun-specific APIs are first-class citizens. Bun.serve, Bun.file, and the test runner all work."/>
    <CB lang="js" code={`Bun.serve({
  port: 8080,
  fetch(req) {
    return new Response('Hello from Gun!')
  }
})`}/>
  </>,

  'npm Dependencies': () => <>
    <H1 c="npm Dependencies"/>
    <Lead c="Gun walks your full dependency tree and transpiles each package. Pure-JS packages work out of the box."/>
    <P c="Packages with native addons (.node files) need an alias to a hand-written Go equivalent. Configure aliases in gun.config.js."/>
    <CB lang="js" file="gun.config.js" code={`export default {
  aliases: {
    'bcrypt':  'github.com/my/bcrypt-go',
    'sharp':   'github.com/my/sharp-go',
  }
}`}/>
    <Note type="tip">Most production npm packages — express, axios, lodash, zod — transpile cleanly with no aliases needed.</Note>
  </>,

  'gun.config.js': () => <>
    <H1 c="gun.config.js"/>
    <Lead c="A single config file at your project root drives the transpiler."/>
    <CB lang="js" file="gun.config.js" code={`export default {
  entry: 'src/index.js',
  out: 'go/',
  module: 'github.com/my/app',
  sourceMaps: true,
  target: 'node20',
  aliases: {
    'lodash': 'github.com/my/lodash-go',
  },
  ignore: ['**/*.test.js'],
}`}/>

    <H2 c="Options"/>
    <div style={{ marginTop:8, border:`1px solid ${C.border}`, borderRadius:10, overflow:'hidden' }}>
      {[
        ['entry','string','Entry file or array of entries'],
        ['out','string','Output directory for emitted Go'],
        ['module','string','Go module path (matches go.mod)'],
        ['sourceMaps','boolean','Emit source maps (default: false)'],
        ['target','string','node20, node22, bun1'],
        ['aliases','object','npm package → Go module overrides'],
        ['ignore','string[]','Glob patterns to skip'],
      ].map(([k,t,d],i)=>(
        <div key={k} style={{ display:'grid', gridTemplateColumns:'170px 110px 1fr', gap:14, padding:'12px 16px', fontSize:13.5, background: i%2 ? 'rgba(66,68,147,0.04)' : 'transparent', borderBottom: i<6 ? `1px solid ${C.border}` : 'none' }}>
          <IC c={k}/>
          <span style={{ color:C.green, fontFamily:"'JetBrains Mono',monospace", fontSize:12 }}>{t}</span>
          <span style={{ color:C.muted }}>{d}</span>
        </div>
      ))}
    </div>
  </>,

  'CLI Reference': () => <>
    <H1 c="CLI Reference"/>
    <Lead c="Every gun subcommand and flag, in one place."/>

    <H2 c="gun transpile"/>
    <P c="One-shot transpilation. Writes the Go output and exits."/>
    <CB lang="bash" code={`gun transpile <input> [flags]

  -o, --out <path>      Output file or directory
      --source-maps     Emit .map files alongside output
      --config <path>   Path to gun.config.js
      --target <env>    node20 | node22 | bun1`}/>

    <H2 c="gun watch"/>
    <P c="Long-running mode. Re-transpiles on file change with incremental Tree-sitter parses."/>
    <CB lang="bash" code={`gun watch src/ -o go/
# → Watching 142 files
# → Changed: src/server.js (re-transpiled in 12ms)`}/>

    <H2 c="gun check"/>
    <P c="Validates transpilability without emitting output. Useful as a CI gate."/>
    <CB lang="bash" code={`gun check src/
# → ✓ 142 files OK`}/>

    <H2 c="gun debug"/>
    <P c="Inspects intermediate stages of the pipeline. Pass --stage=parse|analyze|emit|link."/>
    <CB lang="bash" code={`gun debug src/server.js --stage=analyze`}/>
  </>,

  'Source Maps': () => <>
    <H1 c="Source Maps"/>
    <Lead c="Pass --source-maps and Gun emits a .go.map alongside every .go file. Stack traces in production map back to your original JS lines."/>
    <CB lang="bash" code={`gun transpile src/ -o go/ --source-maps`}/>
    <Note>Maps are inline-position-accurate — column numbers survive minification and the analysis pass.</Note>
  </>,

  'Incremental Builds': () => <>
    <H1 c="Incremental Builds"/>
    <Lead c="Gun's watch mode reuses Tree-sitter's incremental parser. Only the modified subtree is reanalyzed and re-emitted."/>
    <P c="Cold builds of a 50k-line codebase typically finish in under 4 seconds. Warm rebuilds — single-file edits — are usually under 20ms."/>
  </>,

  'CI Integration': () => <>
    <H1 c="CI Integration"/>
    <Lead c="Two commands cover most CI flows: gun check on PRs, gun transpile + go build on release."/>
    <CB lang="bash" code={`# .github/workflows/ci.yml
- run: npm i -g gun-transpiler
- run: gun check src/
- run: gun transpile src/ -o go/
- run: go build -o bin/server ./go/...`}/>
  </>,

  'Debugging': () => <>
    <H1 c="Debugging"/>
    <Lead c="Source maps + go run + delve gives you a familiar JS-like debugging experience on top of a Go binary."/>
    <CB lang="bash" code={`# Step through transpiled code
dlv debug ./go/server.go

# View the original JS source for any frame
(dlv) source-map`}/>
    <Note type="warn">If you hit a runtime error that's hard to trace, run with <IC c="GUN_TRACE=1"/> — every JSValue operation is logged with its source location.</Note>
  </>,
};
