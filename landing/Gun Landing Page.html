<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gun — Compile JavaScript to Go</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: "Space Grotesk", sans-serif;
        background: #08080f;
        color: #e8e8f4;
        min-height: 100vh;
        overflow-x: hidden;
        line-height: 1.55;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image:
          radial-gradient(
            ellipse 70% 50% at 80% -10%,
            rgba(66, 68, 147, 0.55) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse 50% 40% at 0% 30%,
            rgba(66, 68, 147, 0.35) 0%,
            transparent 55%
          );
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.6;
        background-image:
          linear-gradient(rgba(66, 68, 147, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(66, 68, 147, 0.06) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(
          ellipse 80% 70% at 50% 30%,
          #000 0%,
          transparent 75%
        );
      }
      #root {
        position: relative;
        z-index: 1;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-12px);
        }
      }
      @keyframes glow-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      @keyframes ticker {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }
      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }
      @keyframes scan {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(100%);
        }
      }
      ::selection {
        background: #424493;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/ {
        primaryColor: "#424493",
        heroLine1: "Write JavaScript.",
        heroLine2: "Ship a Go binary.",
        showTicker: false,
        accentMode: "purple",
      }; /*EDITMODE-END*/

      // Palette
      const C = {
        bg: "#08080f",
        panel: "#10101e",
        panelHi: "#16162a",
        border: "rgba(66,68,147,0.25)",
        borderHi: "rgba(66,68,147,0.55)",
        text: "#e8e8f4",
        muted: "#8888aa",
        dim: "#5c5cb8",
        faint: "#44445a",
        primary: "#424493",
        primaryHi: "#6666cc",
        green: "#4eca8a",
        amber: "#f5c542",
        cyan: "#4dd0e8",
        pink: "#f472b6",
      };

      // ── Mascot (same as v1, the canonical "MascotB") ─────────────────────────
      const Mascot = ({ size = 240, glow = true }) => (
        <div
          style={{
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            position: "relative",
            width: size + 80,
            height: size + 80,
          }}
        >
          {glow && (
            <div
              style={{
                position: "absolute",
                width: size + 80,
                height: size + 80,
                background:
                  "radial-gradient(circle, rgba(66,68,147,0.35) 0%, transparent 70%)",
                borderRadius: "50%",
                animation: "glow-pulse 3s ease-in-out infinite",
              }}
            />
          )}
          <svg
            style={{
              position: "relative",
              width: size,
              animation: "float 4s ease-in-out infinite",
              filter: "drop-shadow(0 16px 48px rgba(66,68,147,0.5))",
            }}
            viewBox="0 0 200 200"
            fill="none"
          >
            <defs>
              <radialGradient id="mb1" cx="40%" cy="35%" r="65%">
                <stop offset="0%" stopColor="#6666d4" />
                <stop offset="100%" stopColor="#2a2a72" />
              </radialGradient>
              <radialGradient id="mb2" cx="35%" cy="30%" r="65%">
                <stop offset="0%" stopColor="white" stopOpacity="0.15" />
                <stop offset="100%" stopColor="white" stopOpacity="0" />
              </radialGradient>
            </defs>
            <circle cx="100" cy="96" r="80" fill="url(#mb1)" />
            <ellipse cx="82" cy="54" rx="18" ry="22" fill="#3535a0" />
            <ellipse cx="118" cy="54" rx="18" ry="22" fill="#3535a0" />
            <circle cx="100" cy="96" r="76" fill="url(#mb1)" />
            <circle cx="100" cy="96" r="76" fill="url(#mb2)" />
            <ellipse
              cx="78"
              cy="62"
              rx="28"
              ry="16"
              fill="white"
              opacity="0.08"
              transform="rotate(-15 78 62)"
            />
            <circle cx="78" cy="92" r="18" fill="white" />
            <circle cx="122" cy="92" r="18" fill="white" />
            <circle cx="80" cy="94" r="11" fill="#0f0f2e" />
            <circle cx="124" cy="94" r="11" fill="#0f0f2e" />
            <circle cx="85" cy="88" r="4.5" fill="white" opacity="0.95" />
            <circle cx="129" cy="88" r="4.5" fill="white" opacity="0.95" />
            <path
              d="M82 120 Q100 136 118 120"
              stroke="#0f0f2e"
              strokeWidth="3.5"
              fill="none"
              strokeLinecap="round"
            />
            <ellipse
              cx="56"
              cy="114"
              rx="16"
              ry="9"
              fill="#f472b6"
              opacity="0.22"
            />
            <ellipse
              cx="144"
              cy="114"
              rx="16"
              ry="9"
              fill="#f472b6"
              opacity="0.22"
            />
          </svg>
        </div>
      );

      // Small mascot head (icon-sized) — for nav, footer
      const MascotMark = ({ size = 28 }) => (
        <svg
          width={size}
          height={size}
          viewBox="0 0 200 200"
          fill="none"
          style={{
            flexShrink: 0,
            filter: "drop-shadow(0 0 8px rgba(66,68,147,0.6))",
          }}
        >
          <defs>
            <radialGradient id={`mm-${size}`} cx="40%" cy="35%" r="65%">
              <stop offset="0%" stopColor="#6666d4" />
              <stop offset="100%" stopColor="#2a2a72" />
            </radialGradient>
          </defs>
          <ellipse cx="82" cy="54" rx="18" ry="22" fill="#3535a0" />
          <ellipse cx="118" cy="54" rx="18" ry="22" fill="#3535a0" />
          <circle cx="100" cy="96" r="80" fill={`url(#mm-${size})`} />
          <circle cx="78" cy="92" r="18" fill="white" />
          <circle cx="122" cy="92" r="18" fill="white" />
          <circle cx="80" cy="94" r="11" fill="#0f0f2e" />
          <circle cx="124" cy="94" r="11" fill="#0f0f2e" />
          <circle cx="85" cy="88" r="4.5" fill="white" />
          <circle cx="129" cy="88" r="4.5" fill="white" />
          <path
            d="M82 120 Q100 136 118 120"
            stroke="#0f0f2e"
            strokeWidth="6"
            fill="none"
            strokeLinecap="round"
          />
        </svg>
      );

      // ── InstallTabs ───────────────────────────────────────────────────────
      const PM_COMMANDS = {
        npm: "npm i -g gun-transpiler",
        bun: "bun add -g gun-transpiler",
        yarn: "yarn global add gun-transpiler",
        pnpm: "pnpm add -g gun-transpiler",
      };
      const PM_LIST = ["npm", "bun", "yarn", "pnpm"];

      const InstallTabs = ({ primary, glow = false, size = "md" }) => {
        const [pm, setPm] = useState("npm");
        const [copied, setCopied] = useState(false);
        const cmd = PM_COMMANDS[pm];
        const onCopy = () => {
          try {
            navigator.clipboard.writeText(cmd);
          } catch (e) {}
          setCopied(true);
          setTimeout(() => setCopied(false), 1400);
        };
        const big = size === "lg";
        return (
          <div
            style={{
              display: "inline-flex",
              flexDirection: "column",
              background: "#0a0a14",
              border: `1px solid ${C.borderHi}`,
              borderRadius: 12,
              overflow: "hidden",
              boxShadow: glow ? `0 0 32px ${primary}55` : "none",
              minWidth: big ? 360 : 320,
            }}
          >
            <div
              style={{
                display: "flex",
                borderBottom: `1px solid ${C.border}`,
                background: "rgba(66,68,147,0.06)",
              }}
            >
              {PM_LIST.map((p) => (
                <button
                  key={p}
                  onClick={() => setPm(p)}
                  style={{
                    flex: 1,
                    padding: "8px 0",
                    fontFamily: "'JetBrains Mono',monospace",
                    fontSize: 11,
                    fontWeight: 600,
                    color: pm === p ? C.text : C.faint,
                    background:
                      pm === p ? "rgba(66,68,147,0.18)" : "transparent",
                    border: "none",
                    cursor: "pointer",
                    letterSpacing: "0.06em",
                    borderBottom:
                      pm === p
                        ? `2px solid ${primary}`
                        : "2px solid transparent",
                    borderRadius: 0,
                  }}
                >
                  {p}
                </button>
              ))}
            </div>
            <div
              style={{
                display: "flex",
                alignItems: "center",
                gap: 10,
                padding: big ? "14px 18px" : "12px 16px",
              }}
            >
              <span
                style={{
                  color: C.dim,
                  fontFamily: "'JetBrains Mono',monospace",
                  fontSize: big ? 14 : 13,
                }}
              >
                $
              </span>
              <code
                style={{
                  flex: 1,
                  fontFamily: "'JetBrains Mono',monospace",
                  fontSize: big ? 14 : 13,
                  color: C.text,
                  whiteSpace: "nowrap",
                  overflow: "hidden",
                  textOverflow: "ellipsis",
                }}
              >
                {cmd}
              </code>
              <button
                onClick={onCopy}
                title="Copy to clipboard"
                style={{
                  background: copied
                    ? "rgba(78,202,138,0.15)"
                    : "rgba(66,68,147,0.15)",
                  border: `1px solid ${copied ? "rgba(78,202,138,0.5)" : C.border}`,
                  color: copied ? C.green : C.muted,
                  padding: "5px 10px",
                  borderRadius: 6,
                  cursor: "pointer",
                  fontFamily: "'JetBrains Mono',monospace",
                  fontSize: 10,
                  fontWeight: 700,
                  letterSpacing: "0.1em",
                  textTransform: "uppercase",
                }}
              >
                {copied ? "✓ COPIED" : "COPY"}
              </button>
            </div>
          </div>
        );
      };

      // ── Nav ──────────────────────────────────────────────────────────────────
      const Nav = ({ primary }) => (
        <nav
          style={{
            display: "grid",
            gridTemplateColumns: "auto 1fr auto",
            alignItems: "center",
            gap: 32,
            padding: "18px 48px",
            borderBottom: `1px solid ${C.border}`,
            backdropFilter: "blur(14px)",
            background: "rgba(8,8,15,0.72)",
            position: "sticky",
            top: 0,
            zIndex: 100,
          }}
        >
          <a
            href="#"
            style={{
              display: "flex",
              alignItems: "center",
              gap: 10,
              textDecoration: "none",
            }}
          >
            <MascotMark size={32} />
            <span
              style={{
                fontFamily: "'Syne',sans-serif",
                fontSize: 24,
                fontWeight: 800,
                letterSpacing: -0.5,
                color: C.text,
              }}
            >
              gun
            </span>
          </a>
          <ul
            style={{
              display: "flex",
              gap: 28,
              listStyle: "none",
              justifyContent: "center",
            }}
          >
            {[
              ["Docs", "#docs"],
              ["Playground", "#playground"],
              ["Benchmarks", "#benchmarks"],
              ["Examples", "#examples"],
              ["Blog", "#blog"],
            ].map(([n, h]) => (
              <li key={n}>
                <a
                  href={h}
                  style={{
                    color: C.muted,
                    textDecoration: "none",
                    fontSize: 14,
                    fontWeight: 500,
                  }}
                  onMouseEnter={(e) => (e.target.style.color = C.text)}
                  onMouseLeave={(e) => (e.target.style.color = C.muted)}
                >
                  {n}
                </a>
              </li>
            ))}
          </ul>
          <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
            <a
              href="#"
              style={{
                color: C.muted,
                fontSize: 13,
                fontWeight: 500,
                textDecoration: "none",
                display: "flex",
                alignItems: "center",
                gap: 6,
              }}
              onMouseEnter={(e) => (e.currentTarget.style.color = C.text)}
              onMouseLeave={(e) => (e.currentTarget.style.color = C.muted)}
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 16 16"
                fill="currentColor"
              >
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2 .37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
              </svg>
              14.2k
            </a>
            <a
              href="#"
              style={{
                background: primary,
                color: "white",
                padding: "9px 18px",
                borderRadius: 8,
                fontSize: 13,
                fontWeight: 600,
                textDecoration: "none",
                boxShadow: `0 0 18px ${primary}55`,
              }}
              onMouseEnter={(e) => {
                e.currentTarget.style.background = C.primaryHi;
              }}
              onMouseLeave={(e) => {
                e.currentTarget.style.background = primary;
              }}
            >
              Install →
            </a>
          </div>
        </nav>
      );

      // ── Status Ticker ────────────────────────────────────────────────────────
      const Ticker = () => {
        const items = [
          "v1.0.2 SHIPPED",
          "Bun APIs at parity",
          "New: Tree-sitter incremental rebuilds",
          "npm ecosystem · 98% syntax coverage",
          "Source maps land in main",
          "Used in production by 240+ teams",
          "Average bundle 10× faster than Node",
          "Zero runtime dependencies",
        ];
        const all = [...items, ...items];
        return (
          <div
            style={{
              borderBottom: `1px solid ${C.border}`,
              background: "rgba(66,68,147,0.06)",
              overflow: "hidden",
              position: "relative",
            }}
          >
            <div
              style={{
                display: "flex",
                whiteSpace: "nowrap",
                animation: "ticker 50s linear infinite",
                padding: "10px 0",
              }}
            >
              {all.map((t, i) => (
                <span
                  key={i}
                  style={{
                    fontFamily: "'JetBrains Mono',monospace",
                    fontSize: 11,
                    fontWeight: 600,
                    letterSpacing: "0.1em",
                    color: C.dim,
                    padding: "0 28px",
                    display: "inline-flex",
                    alignItems: "center",
                    gap: 14,
                  }}
                >
                  <span style={{ color: C.green }}>●</span> {t}
                </span>
              ))}
            </div>
          </div>
        );
      };

      // ── Hero ─────────────────────────────────────────────────────────────────
      const Hero = ({ primary, l1, l2 }) => (
        <section
          style={{
            padding: "80px 48px 60px",
            maxWidth: 1480,
            margin: "0 auto",
          }}
        >
          <div
            style={{
              display: "grid",
              gridTemplateColumns: "minmax(0,1.4fr) minmax(0,1fr)",
              gap: 80,
              alignItems: "center",
            }}
          >
            <div>
              <div
                style={{
                  display: "inline-flex",
                  alignItems: "center",
                  gap: 10,
                  fontFamily: "'JetBrains Mono',monospace",
                  fontSize: 11,
                  fontWeight: 600,
                  color: C.dim,
                  marginBottom: 32,
                  padding: "6px 10px 6px 6px",
                  border: `1px solid ${C.border}`,
                  borderRadius: 100,
                  background: "rgba(66,68,147,0.08)",
                }}
              >
                <span
                  style={{
                    background: primary,
                    color: "#fff",
                    padding: "2px 8px",
                    borderRadius: 100,
                    letterSpacing: "0.1em",
                  }}
                >
                  NEW
                </span>
                v1.0.2 — Tree-sitter rebuilds &amp; full Bun API
                <span style={{ color: C.muted }}>→</span>
              </div>
              <h1
                style={{
                  fontFamily: "'Syne',sans-serif",
                  fontSize: "clamp(56px,7.5vw,116px)",
                  fontWeight: 800,
                  lineHeight: 0.92,
                  letterSpacing: -3.5,
                  marginBottom: 32,
                  color: C.text,
                }}
              >
                {l1}
                <br />
                <span style={{ color: C.muted, fontWeight: 800 }}>Ship a </span>
                <span
                  style={{
                    background:
                      "linear-gradient(135deg,#a0a0ff 0%,#7c7ee8 50%,#424493 100%)",
                    WebkitBackgroundClip: "text",
                    WebkitTextFillColor: "transparent",
                    backgroundClip: "text",
                  }}
                >
                  Go binary.
                </span>
              </h1>
              <p
                style={{
                  fontSize: 19,
                  color: C.muted,
                  lineHeight: 1.55,
                  maxWidth: 560,
                  marginBottom: 36,
                }}
              >
                Gun is a JavaScript-to-Go transpiler. It compiles your codebase
                — and the npm dependencies underneath it — into idiomatic Go
                that runs on real hardware, with full Node and Bun API
                compatibility.
              </p>
              <div
                style={{
                  display: "flex",
                  gap: 14,
                  alignItems: "center",
                  flexWrap: "wrap",
                  marginBottom: 32,
                }}
              >
                <InstallTabs primary={primary} glow size="lg" />
                <a
                  href="#playground"
                  style={{
                    color: C.text,
                    padding: "13px 22px",
                    borderRadius: 10,
                    fontSize: 14,
                    fontWeight: 500,
                    textDecoration: "none",
                    border: `1px solid ${C.borderHi}`,
                    display: "inline-flex",
                    alignItems: "center",
                    gap: 8,
                  }}
                  onMouseEnter={(e) => {
                    e.currentTarget.style.background = "rgba(66,68,147,0.1)";
                  }}
                  onMouseLeave={(e) => {
                    e.currentTarget.style.background = "transparent";
                  }}
                >
                  Try in playground
                </a>
              </div>
              <div
                style={{
                  display: "flex",
                  gap: 32,
                  paddingTop: 24,
                  borderTop: `1px solid ${C.border}`,
                  color: C.muted,
                  fontSize: 12,
                  fontFamily: "'JetBrains Mono',monospace",
                  letterSpacing: "0.06em",
                }}
              >
                <div>
                  <span style={{ color: C.green }}>●</span> NODE 20+{" "}
                </div>
                <div>
                  <span style={{ color: C.green }}>●</span> BUN 1.x{" "}
                </div>
                <div>
                  <span style={{ color: C.green }}>●</span> TS 5.x{" "}
                </div>
                <div>
                  <span style={{ color: C.green }}>●</span> CJS / ESM{" "}
                </div>
              </div>
            </div>
            <div
              style={{
                display: "flex",
                justifyContent: "center",
                alignItems: "center",
                position: "relative",
              }}
            >
              <Mascot size={300} />
            </div>
          </div>
        </section>
      );

      // ── Logo Marquee ─────────────────────────────────────────────────────────
      const LogoStrip = () => {
        const orgs = [
          "vercel",
          "linear",
          "stripe",
          "figma",
          "shopify",
          "railway",
          "planetscale",
          "clerk",
        ];
        return (
          <section
            style={{
              padding: "40px 48px",
              maxWidth: 1480,
              margin: "0 auto",
              borderTop: `1px solid ${C.border}`,
              borderBottom: `1px solid ${C.border}`,
            }}
          >
            <div
              style={{
                display: "grid",
                gridTemplateColumns: "auto 1fr",
                gap: 40,
                alignItems: "center",
              }}
            >
              <div
                style={{
                  fontFamily: "'JetBrains Mono',monospace",
                  fontSize: 11,
                  color: C.dim,
                  letterSpacing: "0.12em",
                  textTransform: "uppercase",
                  maxWidth: 160,
                }}
              >
                Trusted by teams
                <br />
                at 240+ companies
              </div>
              <div
                style={{
                  display: "flex",

          color: C.muted,
          marginBottom: 6,
          display: "block",
        };
        return (
          <div
            style={{
              position: "fixed",
              bottom: 24,
              right: 24,
              width: 280,
              background: C.panelHi,
              border: `1px solid ${C.borderHi}`,
              borderRadius: 14,
              padding: 20,
              zIndex: 1000,
              boxShadow: "0 24px 64px rgba(0,0,0,0.6)",
            }}
          >
            <div
              style={{
                fontFamily: "'Syne',sans-serif",
                fontWeight: 800,
                fontSize: 14,
                marginBottom: 16,
                color: C.text,
                borderBottom: `1px solid ${C.border}`,
                paddingBottom: 10,
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
              }}
            >
              Tweaks
              <span
                style={{
                  fontFamily: "'JetBrains Mono',monospace",
                  fontSize: 10,
                  color: C.dim,
                  fontWeight: 500,
                }}
              >
                v2
              </span>
            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={lbl}>Primary color</label>
              <input
                type="color"
                value={tweaks.primaryColor}
                onChange={(e) => update("primaryColor", e.target.value)}
                style={{
                  width: "100%",
                  height: 36,
                  border: `1px solid ${C.border}`,
                  borderRadius: 6,
                  background: "transparent",
                  cursor: "pointer",
                  padding: 2,
                }}
              />
            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={lbl}>Hero line 1</label>
              <input
                type="text"
                value={tweaks.heroLine1}
                onChange={(e) => update("heroLine1", e.target.value)}
                style={inp}
              />
            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={lbl}>Hero line 2</label>
              <input
                type="text"
                value={tweaks.heroLine2}
                onChange={(e) => update("heroLine2", e.target.value)}
                style={inp}
              />
            </div>
            <div
              style={{
                marginBottom: 6,
                display: "flex",
                alignItems: "center",
                justifyContent: "space-between",
              }}
            >
              <label style={{ ...lbl, marginBottom: 0 }}>Status ticker</label>
              <input
                type="checkbox"
                checked={tweaks.showTicker}
                onChange={(e) => update("showTicker", e.target.checked)}
                style={{ width: 16, height: 16, accentColor: C.primary }}
              />
            </div>
          </div>
        );
      };

      // ── App ───────────────────────────────────────────────────────────────────
      const App = () => {
        const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
        const p = tweaks.primaryColor;
        return (
          <>
            <Nav primary={p} />
            {tweaks.showTicker && <Ticker />}
            <Hero primary={p} l1={tweaks.heroLine1} l2={tweaks.heroLine2} />
            <LogoStrip />
            <CodeShowcase />
            <Benchmarks />
            <Anatomy />
            <Pillars />
            <Quote />
            <FAQ />
            <CTA primary={p} />
            <Footer />
            <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} />
          </>
        );
      };

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
