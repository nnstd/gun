apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nnstd-gun-landing
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nnstd/gun.git
    targetRevision: HEAD
    path: landing/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: nnstd-gun-landing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
